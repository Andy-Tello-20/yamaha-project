<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Yamaha XTZ 250 en excelente estado. ¡Consultá ahora!" />

  <!-- El título que aparece arriba en la pestaña del navegador -->
<title>Yamaha XTZ 250 | Moto en Venta</title>

<!-- Descripción breve que usan los buscadores como Google -->
<meta name="description" content="Yamaha XTZ 250 en excelente estado. ¡Consultá ahora!" />

<!-- Indica a las redes que este enlace es un sitio web -->
<meta property="og:type" content="website" />

<!-- El título en negrita que aparece en la vista previa de WhatsApp/Facebook -->
<meta property="og:title" content="Yamaha XTZ 250 | Moto en Venta" />

<!-- El texto pequeño que aparece debajo del título en el mensaje compartido -->
<meta property="og:description" content="Excelente oportunidad. Mirá las fotos y detalles de la XTZ 250 aquí." />

<!-- La dirección oficial de tu página (ayuda a las redes a no duplicar info) -->
<meta property="og:url" content="https://andy-tello-20.github.io" />

<!-- LA FOTO: El link directo a tu imagen en la carpeta public -->
<meta property="og:image" content="https://andy-tello-20.github.io/yamaha-project/moto.webp" />

<!-- Le dice a la red social que el archivo es una imagen tipo JPEG -->
<meta property="og:image:type" content="image/jpeg" />

<!-- Define el ancho de la imagen para que WhatsApp la cargue rápido -->
<meta property="og:image:width" content="1200" />

<!-- Define el alto de la imagen para que no se vea cortada -->
<meta property="og:image:height" content="630" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
